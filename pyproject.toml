[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "architect-ai"
version = "0.1.0"
description = "Architectural orchestration service: Phase 1 foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "openai>=3.22.1,<4",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8,<10", "httpx2>=2.13.1,<3", "ruff>=0.11,<1", "mypy>=1.15,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
architect_ai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
