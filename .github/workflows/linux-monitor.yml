name: Linux automatic tests

on:
  push:
    branches: [main]
    paths: ['.github/workflows/linux-monitor.yml']
  schedule:
    - cron: '17 * * * *'
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Test scope
        type: choice
        options: [quick, full]
        default: full

permissions:
  contents: read

concurrency:
  group: linux-monitor-${{ github.event.schedule || inputs.mode || 'full' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARCHITECT_AI_RUN_LIVE_OPENAI_TESTS: '0'
      ARCHITECT_AI_MCP_LIVE_INTERPRETER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev,mcp]' 'setuptools>=77,<85' wheel
      - name: Run tests and save evidence
        env:
          TEST_MODE: ${{ github.event.schedule == '17 * * * *' && 'quick' || inputs.mode || 'full' }}
        run: python scripts/continuous_tests.py --mode "$TEST_MODE" --output "$RUNNER_TEMP/architect-results"
      - name: Preserve reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/architect-results/
          if-no-files-found: warn
          retention-days: 30
